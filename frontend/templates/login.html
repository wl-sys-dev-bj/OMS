{% load static %}

<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
    <title>Employee Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
</head>

<body>
    <main class="login-page">
        <div class="login-card">
            <p class="eyebrow">OMS · PEOPLE OPERATIONS</p>
            <h1>Welcome back</h1>
            <p class="login-intro">Sign in to manage employee records, joining details, and billing.</p>
            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}
                <label for="username">User name</label>
                <input type="text" name="username" id="username" autocomplete="username" required>
                <label for="password">Password</label>
                <div class="password-field">
                    <input type="password" name="password" id="password" autocomplete="current-password" required>
                    <button type="button" id="togglePassword" aria-label="Show password">Show</button>
                </div>
                {% if messages %}
                    {% for message in messages %}
                    <p class="login-error" role="alert">{{ message }}</p>
                    {% endfor %}
                {% endif %}
                <button class="login-submit" type="submit">Sign in <span aria-hidden="true">→</span></button>
            </form>
            <p class="login-foot">Secure workforce administration</p>
        </div>
    </main>
    <script>
        const password = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", function () {
            const visible = password.type === "password";
            password.type = visible ? "text" : "password";
            togglePassword.textContent = visible ? "Hide" : "Show";
            togglePassword.setAttribute("aria-label", visible ? "Hide password" : "Show password");
        });
    </script>
</body>

</html>
